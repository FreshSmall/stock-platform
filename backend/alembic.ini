# Alembic configuration for the stock-platform backend.
#
# The actual DB connection URL is NOT set here; it is computed at runtime in
# alembic/env.py from app.core.config.settings (which reads .env). Keeping
# sqlalchemy.url empty here avoids leaking credentials and lets env.py own the
# URL construction (with proper URL-encoding of special characters).

[alembic]
# Path to the migration scripts directory (relative to this ini file).
script_location = alembic

# Template used to generate new migration files.
# file_template = %%(rev)s_%%(slug)s

# Timezone for the ``Date`` column of the version table. Empty = naive UTC.
# timezone =

# Maximum length of characters to apply to the "slug" field.
# truncate_slug_length = 40

# The output encoding used when revision files are written.
# output_encoding = utf-8

# NOTE: intentionally left blank. env.py sets url = engine.url.render_as_string().
sqlalchemy.url =

[post_write_hooks]
# (none configured)

# Logging configuration: roughly mirrors the default generated by
# `alembic init`, trimmed for our needs.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
