[project]
name = "stock-platform-backend"
version = "0.1.0"
description = "AI Quant Platform backend - FastAPI service for stock analysis."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[2.0]",
    "alembic",
    "pydantic-settings",
    "pymysql",
    "cryptography",
    "cachetools",
    "apscheduler",
    "pandas",
    "numpy",
    "backtrader",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "httpx[socks]",
    "python-jose[cryptography]",
    # passlib 1.7.4 probes bcrypt.__about__.__version__, which was removed in
    # bcrypt >=4.1 and breaks password hashing. Pin a compatible release.
    "bcrypt<4.1",
    "passlib[bcrypt]",
    "akshare",
    "pytest",
    "pytest-asyncio",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx[socks]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
