<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>stock-platform 系统架构 · Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', 'PingFang SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', 'PingFang SC', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>

<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Stock-Platform</p>
    <h1>AI 量化平台系统架构</h1>

    <svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="stock-arch-title stock-arch-desc">
      <title id="stock-arch-title">AI 量化平台系统架构</title>
      <desc id="stock-arch-desc">系统架构总览：浏览器 React SPA 经 nginx 前端容器代理调用 FastAPI 后端；APScheduler 在交易日盘后驱动数据同步层，从 akshare、腾讯、东财抓取行情并幂等写入 MySQL（阿里云 RDS，全平台唯一数据枢纽）；因子与 ML 引擎按用户请求实时计算，FastAPI 另外调用 DeepSeek 大模型生成 AI 分析。</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <text x="268" y="123" fill="rgba(45,49,66,0.40)" font-size="7"
            font-family="'Geist Mono', 'PingFang SC', monospace" text-anchor="middle" letter-spacing="0.14em">DOCKER COMPOSE</text>

      <!-- A1 浏览器 → 前端容器 -->
      <line x1="172" y1="188" x2="232" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <text x="424" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" text-anchor="middle" letter-spacing="0.06em">PROXY</text>

      <text x="716" y="261" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.06em">READ</text>

      <text x="548" y="275" fill="#7a8399" font-size="8" font-family="'Geist Mono', 'PingFang SC', monospace" letter-spacing="0.06em">/FACTOR · /ML</text>
